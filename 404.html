<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Julie Loyez</title>
  <meta name="robots" content="noindex">

  <!--
    404.html: shown automatically by GitHub Pages when someone visits an
    address that doesn't exist on the site. It reuses the site's styles.
    Paths start with "/" so they work from any address.
  -->
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <section class="hero not-found">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="hero-label">404 · Page not found</p>
          <h1 class="hero-name">This page doesn't exist.</h1>
          <p class="hero-tagline">Maybe the link is old, or there's a small typo. Everything I've built is on the home page.</p>
          <div class="button-row">
            <a class="btn btn-primary" href="/">Back to the home page</a>
            <a class="btn btn-secondary" href="/#projects">See my projects</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
